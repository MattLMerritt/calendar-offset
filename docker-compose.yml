services:
  calendar-offset:
    image: merrittlmatt/calendar-offset:latest
    build: .
    container_name: calendar-offset
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - CALENDAR_URL
      - PORT=${PORT:-3000}
    env_file:
      - path: .env
        required: false


